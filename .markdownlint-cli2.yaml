# Configuration for markdownlint-cli2
# https://github.com/DavidAnson/markdownlint-cli2

config:
  # Line length - disabled for readability
  MD013: false

  # Multiple consecutive blank lines - allow up to 2
  MD012:
    maximum: 2

  # Ordered list item prefix - disabled (allow any style)
  MD029: false

  # Fenced code blocks should have a language specified
  MD040: false
